[workspace]
resolver = "3"
members = ["crates/hackkid-core", "crates/hackkid"]
default-members = ["crates/hackkid"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
