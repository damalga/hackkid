[package]
name = "hackkid"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rodio = { version = "0.19", default-features = false, features = ["symphonia-vorbis"] }
